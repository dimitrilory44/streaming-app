  <circle cx="160" cy="108" r="42" fill="#171d2c" stroke="#5b6b93" stroke-width="4"/>
  <circle cx="160" cy="108" r="30" fill="none" stroke="#3a4460" stroke-width="1.5"/>
  <line x1="190" y1="138" x2="222" y2="170" stroke="#5b6b93" stroke-width="6" stroke-linecap="round"/>

  <path d="M144 108 Q160 96 176 108" fill="none" stroke="#8b93b8" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
