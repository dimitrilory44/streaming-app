  <rect x="70" y="150" width="46" height="46" rx="10" fill="#1b2130" stroke="#2a3145" stroke-width="1.5"/>
  <rect x="137" y="140" width="46" height="46" rx="10" fill="#1e2536" stroke="#2f3750" stroke-width="1.5"/>
  <rect x="204" y="150" width="46" height="46" rx="10" fill="#1b2130" stroke="#2a3145" stroke-width="1.5"/>

  <line x1="83" y1="167" x2="103" y2="179" stroke="#3a4258" stroke-width="2" stroke-linecap="round"/>
  <line x1="103" y1="167" x2="83" y2="179" stroke="#3a4258" stroke-width="2" stroke-linecap="round"/>

  <line x1="150" y1="157" x2="170" y2="169" stroke="#414a66" stroke-width="2" stroke-linecap="round"/>
  <line x1="170" y1="157" x2="150" y2="169" stroke="#414a66" stroke-width="2" stroke-linecap="round"/>

  <line x1="217" y1="167" x2="237" y2="179" stroke="#3a4258" stroke-width="2" stroke-linecap="round"/>
  <line x1="237" y1="167" x2="217" y2="179" stroke="#3a4258" stroke-width="2" stroke-linecap="round"/>

