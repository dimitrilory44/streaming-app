<div class="criteria-sheet" cdkDrag cdkDragLockAxis="y" cdkDragRootElement=".cdk-overlay-pane"
  [cdkDragConstrainPosition]="keepBelowStart" (cdkDragEnded)="onDragEnded($event)">

  <div class="criteria-sheet__handle" cdkDragHandle aria-hidden="true"></div>

  <mat-accordion class="criteria-accordion" multi displayMode="flat">
    <div class="criteria-sheet__header">
      <h2 class="criteria-sheet__title">Filtres</h2>
      @if (activeFilter() > 0) {
      <span class="criteria-sheet__count">
        {{ activeFilter() }} {{ activeFilter() > 1 ? 'actifs' : 'actif' }}
      </span>
      }
    </div>
    @for (criteria of criteriaList(); track criteria.key) {
    <mat-expansion-panel class="criteria-accordion__panel" [class.is-active]="criteria.isActive">
      <mat-expansion-panel-header class="criteria-accordion__header">
        <mat-panel-title>{{ criteria.label }}</mat-panel-title>
      </mat-expansion-panel-header>
      <filter-criteria-group [criteria]="criteria.items" [showReset]="false" />
    </mat-expansion-panel>
    }
  </mat-accordion>

  <div class="sheet-actions">
    <button type="button" class="sheet-actions__btn sheet-actions__btn--primary" (click)="resetAll()">
      Tout Réinitialiser
    </button>
  </div>
</div>
