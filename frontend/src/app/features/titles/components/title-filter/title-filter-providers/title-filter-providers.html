<section class="providers-panel" aria-label="Mes services">
    <div class="providers-panel__header">
        <span class="providers-panel__title">
            Mes services
            <span class="providers-panel__count">({{ count() | number:'1.0-0' }})</span>
        </span>
        <button type="button" class="providers-panel__add" aria-label="Choisir mes services" (click)="openDialog()">
            <mat-icon>add</mat-icon>
        </button>
    </div>

    <div class="providers-panel__list">
        <button type="button" class="providers-panel__nav providers-panel__nav--prev" aria-label="Services précédents">
            <mat-icon>chevron_left</mat-icon>
        </button>

        <div class="providers-panel__slider swiper" appSwiper [config]="swiperConfig">
            <div class="swiper-wrapper">
                @for (provider of providers(); track provider.provider_id) {
                    <icon-chip
                        class="swiper-slide providers-panel__chip"
                        [iconUrl]="provider.logo_path | tmdbImage:'w45'"
                        [label]="provider.provider_name"
                        [removable]="false"
                    />
                }
            </div>
        </div>

        <button type="button" class="providers-panel__nav providers-panel__nav--next" aria-label="Services suivants">
            <mat-icon>chevron_right</mat-icon>
        </button>
    </div>
</section>
