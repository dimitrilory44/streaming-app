<div class="icon-chip">
  <img 
    [src]="iconUrl()" 
    [alt]="label()" 
    class="icon-chip__image" 
    appImgFallback="assets/provider-fallback.svg"
  />

  @if (removable()) {
  <button class="icon-chip__remove" type="button" [attr.aria-label]="'Retirer ' + label()"
    (click)="onRemove($event)">
    <mat-icon>remove</mat-icon>
  </button>
  }
</div>
