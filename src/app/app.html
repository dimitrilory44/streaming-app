@if (!isOnline()) {
  <div class="offline-banner">
    Vous êtes hors ligne. Certaines fonctionnalités peuvent être indisponibles.
  </div>
}

@if (isNavigating()) {
  <loading-bar />
}

<title-header [tabPanel]="tabPanel"/>
<mat-tab-nav-panel #tabPanel>
  <main>
    <router-outlet></router-outlet>
  </main>
</mat-tab-nav-panel>
