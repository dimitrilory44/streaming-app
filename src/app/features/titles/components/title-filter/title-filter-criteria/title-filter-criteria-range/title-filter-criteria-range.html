@if (criterion().key === 'release') {
<div class="criteria-panel__range">
    <form [formGroup]="form">
        <div formArrayName="releaseDates">
            @for (group of releaseDates.controls; track group; let i = $index) {
            <div [formGroupName]="i" class="criteria-panel__range__slider">
                <div class="filter_area__start">1900</div>
                <mat-slider min="1900" max="2026" step="1" discrete="true" showTickMarks="true" class="filter_area">
                    <input formControlName="startYear" value="1900" matSliderStartThumb
                        (change)="onReleaseDateChange(criterion().key, $event, i)">
                    <input formControlName="endYear" value="2026" matSliderEndThumb
                        (change)="onReleaseDateChange(criterion().key, $event, i)">
                </mat-slider>
                <div class="filter_area__end">{{ currentYear }}</div>
            </div>
            <div class="criteria-panel__range__actions">
                <mat-checkbox class="btn-checkbox" [checked]="selectedRange() === 'thisYear'"
                    (click)="$event.stopPropagation()" (change)="onSelectRangePreset('release', i, 'thisYear')">
                    Cette année</mat-checkbox>
                <mat-checkbox class="btn-checkbox" [checked]="selectedRange() === 'lastYear'"
                    (change)="onSelectRangePreset(criterion().key, i, 'lastYear')" (click)="$event.stopPropagation()">
                    Année dernière</mat-checkbox>
            </div>
            }
        </div>
    </form>
</div>
}

@if (criterion().key === 'note') {
<div class="criteria-panel__range">
    <form>
        <div>
            <div class="criteria-panel__range__slider">
                <img src="assets/tmdb_logo.jpg" alt="icone_tmdb" width="24" height="24" style="margin-right: 10px">
                <div class="filter_area__start">0</div>
                <mat-slider min="0" max="10" step="1" discrete="true" showTickMarks="true" class="filter_area">
                    <input matSliderThumb>
                </mat-slider>
                <div class="filter_area__end">10</div>
            </div>
        </div>
    </form>
</div>
}
