<div class="filter-panel">
    @for (criteria of criteriaList(); track criteria.key) {
      <div class="filter-items">
        <span [class.is-active]="criteria.isActive">{{ criteria.label }}</span>
        <button mat-icon-button class="filter-trigger" [matMenuTriggerFor]="menu"
            (menuOpened)="onMenuOpened(criteria.key)"
            (menuClosed)="onMenuClosed(criteria.key)">
          <mat-icon [class.is-active]="criteria.isActive">
            {{ openMenuKey() === criteria.key ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </button>
      </div>
    
      <mat-menu #menu="matMenu" class="criteria-menu" [overlapTrigger]="false" yPosition="below">
        <div class="criteria-panel" (click)="$event.stopPropagation()">
          <filter-criteria-group
            [title]="criteria.label"
            [criteria]="criteria.items"
            (resetRequested)="reset($event)" />
        </div>
      </mat-menu>
    }

    <div class="criteria-panel__end">
        <button class="criteria-panel__reset" (click)="resetAll()">
            <mat-icon>close</mat-icon>
            Réinitialiser
        </button>
    </div>

</div>
