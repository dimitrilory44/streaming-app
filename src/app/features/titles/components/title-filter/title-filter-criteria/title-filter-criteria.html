<div class="filter-panel">
    @for (menu of menus(); track menu.key) {
      <div class="filter-items">
        <span [class.is-active]="menu.isActive">{{ menu.label }}</span>
        <button mat-icon-button class="filter-trigger" [matMenuTriggerFor]="panel"
            (menuOpened)="onMenuOpened(menu.key)"
            (menuClosed)="onMenuClosed(menu.key)">
          <mat-icon [class.is-active]="menu.isActive">
            {{ openMenuKey() === menu.key ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </button>
      </div>
    
      <mat-menu #panel="matMenu" class="criteria-menu" [overlapTrigger]="false" yPosition="below">
        <div class="criteria-panel" (click)="$event.stopPropagation()">
          <filter-criteria-group
            [title]="menu.label"
            [criteria]="menu.criteria"
            (resetRequested)="reset($event)" />
        </div>
      </mat-menu>
    }

    <div class="criteria-panel__end">
        <button class="criteria-panel__reset" (click)="resetAll()">
            <mat-icon>close</mat-icon>
            Réinitialiser
        </button>
    </div>

</div>
