<header id="top" class="header">
    <mat-toolbar class="header__toolbar">
        @if (isSmallScren()) {
        <div class="header__top">
            <div class="logo"><span class="logo__accent">Just</span><span>Dim</span></div>
            <div class="header__actions">
                <button type="button" class="search-trigger" aria-label="Rechercher (recherche intelligente disponible)">
                    <img src="assets/search-ai.svg" alt="" width="20" height="20" />
                    <span class="search-trigger__label">Recherche Intelligente</span>
                </button>
                <button mat-icon-button class="account-btn" aria-label="Compte">
                    <mat-icon>manage_accounts</mat-icon>
                </button>
            </div>
        </div>
        } @else {
        <div class="logo"><span class="logo__accent">Just</span><span>Dim</span></div>
        }

        <nav mat-tab-nav-bar class="header__nav" [tabPanel]="tabPanel()" mat-stretch-tabs="false"
            aria-label="Navigation principale">
            @for (menu of menus; track menu.label) {
            <a mat-tab-link [routerLink]="menu.path" routerLinkActive #rla="routerLinkActive"
                [routerLinkActiveOptions]="{ exact: menu.exact }" [active]="rla.isActive" [disabled]="!menu.path">
                {{ menu.label }}
            </a>
            }
        </nav>

        @if (!isSmallScren()) {
        <div class="header__search">
            <mat-form-field appearance="outline">
                <mat-icon matPrefix>search</mat-icon>
                <input matInput placeholder="Un titre ... ou décrivez une envie"
                    aria-label="Rechercher un film ou une série">
                <mat-icon matSuffix>auto_awesome</mat-icon>
            </mat-form-field>
        </div>
        <div class="header__actions">
            <button mat-icon-button class="account-btn" aria-label="Compte">
                <mat-icon>manage_accounts</mat-icon>
            </button>
        </div>
        }
    </mat-toolbar>
</header>
